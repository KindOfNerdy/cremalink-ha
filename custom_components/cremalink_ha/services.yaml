brew:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cremalink_ha
    beverage:
      required: true
      example: cappuccino
      selector:
        text:
    coffee:
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: ml
          mode: box
    taste:
      selector:
        number:
          min: 0
          max: 5
          mode: slider
    milk:
      selector:
        number:
          min: 0
          max: 120
          step: 0.1
          unit_of_measurement: s
          mode: box
    water:
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: ml
          mode: box
    tea_temperature:
      selector:
        number:
          min: 1
          max: 3
          mode: slider

set_favorites:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cremalink_ha
    favorites:
      required: true
      example: '["coffee", "latte_macchiato", "Latte XL"]'
      selector:
        text:
          multiple: true
    profile:
      selector:
        number:
          min: 1
          max: 4
          mode: box
