brew:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cremalink_ha
    beverage:
      required: true
      example: cappuccino
      selector:
        text:
    coffee:
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: ml
          mode: box
    taste:
      selector:
        number:
          min: 0
          max: 5
          mode: slider
    milk:
      selector:
        number:
          min: 0
          max: 120
          step: 0.1
          unit_of_measurement: s
          mode: box
    water:
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: ml
          mode: box
    tea_temperature:
      selector:
        number:
          min: 1
          max: 3
          mode: slider

set_favorites:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cremalink_ha
    favorites:
      required: true
      example: '["coffee", "latte_macchiato", "Latte XL"]'
      selector:
        text:
          multiple: true
    profile:
      selector:
        number:
          min: 1
          max: 4
          mode: box

refresh_recipes:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cremalink_ha

save_recipe:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cremalink_ha
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 6
          mode: box
    name:
      required: true
      selector:
        text:
    icon:
      required: true
      selector:
        number:
          min: 0
          max: 25
          mode: box
    coffee:
      selector:
        number:
          min: 0
          max: 180
          mode: box
    taste:
      selector:
        number:
          min: 0
          max: 5
          mode: box
    milk:
      selector:
        number:
          min: 0
          max: 108
          mode: box
    froth:
      selector:
        number:
          min: 0
          max: 2
          mode: box
    milk_first:
      selector:
        boolean:
    water:
      selector:
        number:
          min: 0
          max: 300
          mode: box
    brew:
      default: false
      selector:
        boolean:

get_recipe:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cremalink_ha
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 6
          mode: box

delete_recipe:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cremalink_ha
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 6
          mode: box

save_drink:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cremalink_ha
    beverage:
      required: true
      selector:
        text:
    coffee:
      selector:
        number:
          min: 0
          max: 500
          mode: box
    taste:
      selector:
        number:
          min: 0
          max: 5
          mode: box
    milk:
      selector:
        number:
          min: 0
          max: 300
          mode: box
    water:
      selector:
        number:
          min: 0
          max: 500
          mode: box
    tea_temperature:
      selector:
        number:
          min: 0
          max: 100
          mode: box
    brew:
      default: false
      selector:
        boolean:
